summary:
  de: Third-Person-Hack-’n’-Slash in einer Sumi-e-Tuschewelt. Nahkampf rund um Timing und Haltungsbrüche.
  en: Third-person hack ’n’ slash in a sumi-e ink world. Melee combat built on timing and stance breaks.
tagline:
  de: Zerbrochenes, mit Gold geflickt.
  en: Broken things, mended in gold.
intro:
  de: Ein Third-Person-Hack-’n’-Slash über einen Schwertkämpfer, der eine zerbrochene Welt Kampf für Kampf wieder zusammensetzt. Solo entwickelt in der Unreal Engine 5.8.
  en: A third-person hack ’n’ slash about a swordsman who repairs a shattered world, one fight at a time. Built solo in Unreal Engine 5.8.

