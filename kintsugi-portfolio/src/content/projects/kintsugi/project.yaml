loop:
  heading: { de: Lesen. Brechen. Flicken., en: Read. Break. Mend. }
  text:
    de: Nahkampf auf kurze Distanz mit klaren Signalen, engem Timing und einer Belohnung für jedes Risiko.
    en: Close-range melee with clear tells, tight timing and a reward for every risk.
  steps:
    - { de: Erkunden, en: Explore }
    - { de: Kämpfen, en: Fight }
    - { de: Brechen, en: Break }
    - { de: Flicken, en: Mend }
    - { de: Wachsen, en: Grow }

features:
  - title: { de: Haltung und Bruch, en: Stance and break }
    text:
      de: Jeder Gegner hat eine Haltungsleiste. Brich sie, und eine Goldnaht öffnet sich für einen Finisher.
      en: Every enemy has a stance meter. Break it and a gold seam opens for a finisher.
  - title: { de: Perfekte Parade, en: Perfect parry }
    text:
      de: Ein enges Zeitfenster. Triffst du es, wehrst du ab und heilst ein Stück deiner Gesundheit.
      en: A tight timing window. Land it to deflect and mend a piece of your own health.
  - title: { de: Goldflicken, en: Gold mending }
    text:
      de: Geheilte Wunden werden zu Gold und verstärken deine nächsten Schläge.
      en: Repaired wounds turn to gold and make your next strikes stronger.
  - title: { de: Combo-Graph, en: Combo graph }
    text:
      de: Leichte, schwere und Tusche-Angriffe verzweigen sich zu Combos mit Cancel-Fenstern.
      en: Light, heavy and ink attacks branch into combos with cancel windows.
  - title: { de: Tusche-Dash, en: Ink dash }
    text:
      de: Ein kurzer Ausweichschritt, der einen Pinselstrich hinterlässt. Mit gutem Timing durch Angriffe hindurch.
      en: A short dodge that leaves a brush stroke. Dash through attacks with good timing.
  - title: { de: Lesbare Gegner, en: Readable enemies }
    text:
      de: Silhouetten in Tusche, Signale in Gold. Du weißt immer, was kommt.
      en: Silhouettes in ink, tells in gold. You always know what is coming.

art:
  heading: { de: "Tusche auf Papier, in drei Dimensionen.", en: "Ink on paper, in three dimensions." }
  text:
    de: Stilisiertes 3D, schattiert wie japanische Sumi-e-Malerei. Schwarze Tusche, graue Lavierungen und die Körnung von Papier. Gold ist die einzige warme Farbe im Spiel, so landet der Blick immer dort, wo es zählt.
    en: Stylized 3D shaded like Japanese sumi-e painting. Black ink, grey washes and the grain of paper. Gold is the only warm color in the game, so the eye always lands on what matters.
  palette:
    - { name: { de: Tusche, en: Ink }, hex: "#1D1D1F" }
    - { name: { de: Lavierung, en: Wash }, hex: "#8A8A8E" }
    - { name: { de: Papier, en: Paper }, hex: "#F2EEE6" }
    - { name: { de: Gold, en: Gold }, hex: "#D9A441" }
  concepts:
    - caption:
        de: Ren, der Flicker. In Einzelteile zerlegt für die 3D-Generierung.
        en: Ren, the mender. Broken into parts for 3D generation.
      src: ""
    - caption:
        de: Das Katana bekommt mit jeder Reparatur eine neue Goldnaht.
        en: The katana gains a gold seam with every repair.
      src: ""
    - caption:
        de: Menüs, gezeichnet wie Tusche auf einer Schriftrolle.
        en: Menus drawn as ink on a scroll.
      src: ""

