tech:
  - title: { de: Unreal Engine 5.8, en: Unreal Engine 5.8 }
    text: { de: "Blueprints zum Iterieren, C++ für den Kern des Kampfsystems.", en: "Blueprints for iteration, C++ for the combat core." }
  - title: { de: Fähigkeitensystem, en: Ability system }
    text: { de: "Angriffe, Paraden und Flicken als datengetriebene Fähigkeiten.", en: "Attacks, parries and mending as data-driven abilities." }
  - title: { de: Eigene Character-Pipeline, en: Custom character pipeline }
    text:
      de: Einzelteile als Bilder generiert, in 3D umgewandelt, geriggt und auf UE5-Animationen retargetet.
      en: Parts generated as images, turned into 3D, rigged and retargeted to UE5 animations.
  - title: { de: Tusche-Shading, en: Ink shading }
    text: { de: "Post-Process-Outlines, Papierkörnung und ein Emissive-Kanal nur für Gold.", en: "Post-process outlines, paper grain and a gold-only emissive channel." }
  - title: { de: Niagara-VFX, en: Niagara VFX }
    text: { de: "Tuschespritzer bei Treffern, Goldnähte beim Reparieren.", en: "Ink splashes on hit, gold seams on repair." }

learnings:
  heading: { de: "Was kaputtging, und was ich geflickt habe.", en: "What broke, and what I mended." }
  items:
    - title: { de: "Erst die Größe, dann die Animation", en: "Scale before animation" }
      text:
        de: Ein eigenes Skelett hat meinen Helden beim Retargeting geschrumpft. Root und Pelvis zuerst zu korrigieren, hat später Tage gespart.
        en: A custom skeleton shrank my hero on retarget. Fixing root and pelvis first saved days later.
    - title: { de: "Erst das Gefühl, dann der Inhalt", en: "Feel first, content later" }
      text:
        de: Ein Gegner in einer grauen Box, bis sich das Treffen gut anfühlte. Erst dann kam der zweite.
        en: One enemy in a grey box until hitting it felt good. Only then a second one.
    - title: { de: Eine Akzentfarbe ist eine Regel, en: One accent color is a rule }
      text:
        de: Wärme nur in Gold zu erlauben, hat Lesbarkeit zu einem Designwerkzeug gemacht.
        en: Limiting warmth to gold made readability a design tool, not an afterthought.
