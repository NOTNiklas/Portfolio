about:
  title: About
  eyebrow: About
  heading: I'm Niklas.
  heading_2: I build games and fix printers.
  intro: Second-year IT apprentice, self-taught game developer and the person who reads patch notes for fun.
  portrait: Portrait of Niklas Schumm
  story_title: How it started.
  story:
    - I was twelve when a boss fight made me wonder how it all worked under the hood. I started with small Godot projects, finished almost none of them, and learned that finishing is a skill of its own.
    - Today I work in IT support for a manufacturer with sites across Germany and abroad. Tickets, hardware, printers and production terminals. It taught me to stay calm when things break and to find the cause before the fix.
    - That mindset goes straight into game development. Kintsugi, my current project, is the biggest thing I have attempted, and the most fun.
  based_in: Based in
  principles_eyebrow: How I work
  principles_title: Three rules I try to keep.
  principles:
    - title: Feel over features
      text: One great-feeling attack beats ten mediocre ones.
    - title: Finish things
      text: Small and shipped teaches more than big and abandoned.
    - title: Learn in public
      text: Every bug I fix ends up in the devlog for the next person.
  games_title: Games that shaped me.
  offscreen_eyebrow: Off screen
  offscreen_title: When I'm not at a keyboard.
  cta_title: Say hello.
  cta_text: Questions, jam invites or feedback on Kintsugi. I read everything.
  cta_contact: Get in touch
  cta_career: See my path

