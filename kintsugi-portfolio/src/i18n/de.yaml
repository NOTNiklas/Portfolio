about:
  title: Über mich
  eyebrow: Über mich
  heading: Ich bin Niklas.
  heading_2: Ich baue Spiele und repariere Drucker.
  intro: IT-Azubi im zweiten Jahr, Spieleentwickler im Selbststudium und jemand, der Patch Notes zum Spaß liest.
  portrait: Porträt von Niklas Schumm
  story_title: Wie alles anfing.
  story:
    - Ich war zwölf, als mich ein Bosskampf fragen ließ, wie das alles unter der Haube funktioniert. Angefangen habe ich mit kleinen Godot-Projekten, von denen ich fast keins fertig gemacht habe. Dabei habe ich gelernt, dass Fertigmachen eine eigene Fähigkeit ist.
    - Heute arbeite ich im IT-Support eines Herstellers mit Standorten in Deutschland und im Ausland. Tickets, Hardware, Drucker und Produktionsterminals. Dabei habe ich gelernt, ruhig zu bleiben, wenn etwas kaputtgeht, und erst die Ursache zu finden, bevor ich repariere.
    - Genau diese Denkweise nehme ich in die Spieleentwicklung mit. Kintsugi, mein aktuelles Projekt, ist das Größte, was ich bisher angegangen bin, und das, was am meisten Spaß macht.
  based_in: Wohnort
  principles_eyebrow: Wie ich arbeite
  principles_title: Drei Regeln, an die ich mich halte.
  principles:
    - title: Gefühl vor Features
      text: Ein Angriff, der sich großartig anfühlt, schlägt zehn mittelmäßige.
    - title: Dinge fertig machen
      text: Klein und veröffentlicht lehrt mehr als groß und abgebrochen.
    - title: Öffentlich lernen
      text: Jeder Bug, den ich behebe, landet im Devlog, für den Nächsten.
  games_title: Spiele, die mich geprägt haben.
  offscreen_eyebrow: Abseits des Bildschirms
  offscreen_title: Wenn ich nicht an der Tastatur sitze.
  cta_title: Sag Hallo.
  cta_text: Fragen, Jam-Einladungen oder Feedback zu Kintsugi. Ich lese alles.
  cta_contact: Kontakt aufnehmen
  cta_career: Mein Werdegang

